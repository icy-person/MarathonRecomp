name: Build and Release Sonic CachyOS (Full Game)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: CMake build configuration
        required: true
        default: linux-release
        type: choice
        options:
          - linux-release
          - linux-relwithdebinfo
          - linux-debug
      rar_parts:
        description: Number of RAR parts to download
        required: false
        default: "8"
        type: string
      zstd_level:
        description: zstd payload compression level (1-19)
        required: false
        default: "10"
        type: string

permissions:
  contents: write

env:
  BASE_URL: ${{ secrets.SONIC_BASE_URL }}
  ARCHIVE_PREFIX: ${{ secrets.SONIC_ARCHIVE_PREFIX }}
  ARCHIVE_PASSWORD: ${{ secrets.SONIC_ARCHIVE_PASSWORD }}
  INSTALLER_NAME: Sonic-the-Hedgehog-2006-CachyOS-FULL-installer.run

jobs:
  build:
    name: Build & Release Sonic (Full Single-File)
    runs-on: ubuntu-24.04

    container:
      image: archlinux:latest

    steps:
      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel git cmake ninja clang llvm lld \
            gtk3 alsa-lib libpulse pipewire pkgconf p7zip unrar zstd \
            curl zip unzip tar file binutils ca-certificates zlib
          pacman -Scc --noconfirm || true
          update-ca-trust
          for c in git cmake ninja clang llvm-ar llvm-ranlib curl tar zip unzip 7z unrar zstd; do
            command -v "${c}" >/dev/null || { echo "ERROR: missing ${c}"; exit 1; }
          done
          zstd --version

      - name: Checkout MarathonRecomp
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Data Root (disk space)
        id: dataroot
        shell: bash
        run: |
          set -euo pipefail
          NEED_KB=$((15 * 1024 * 1024))
          CHOICE=""
          for d in /mnt /var/tmp /tmp "${GITHUB_WORKSPACE}"; do
            [ -d "${d}" ] || continue
            [ -w "${d}" ] || continue
            AVAIL_KB="$(df -Pk "${d}" | awk 'NR==2 {print $4}')"
            echo "candidate ${d}: ${AVAIL_KB} KiB free"
            if [ "${AVAIL_KB}" -ge "${NEED_KB}" ]; then
              CHOICE="${d}"
              break
            fi
          done
          if [ -z "${CHOICE}" ]; then
            CHOICE="${GITHUB_WORKSPACE}"
            echo "WARNING: no location with >= 15 GiB free; using workspace." >&2
          fi
          mkdir -p "${CHOICE}/sonicdata"
          echo "DATA_ROOT=${CHOICE}/sonicdata" >> "${GITHUB_ENV}"
          echo "path=${CHOICE}/sonicdata" >> "${GITHUB_OUTPUT}"
          df -h || true

      - name: Build extract-xiso
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/extract-xiso
          git clone --depth 1 https://github.com/XboxDev/extract-xiso.git /tmp/extract-xiso
          cmake -S /tmp/extract-xiso -B /tmp/extract-xiso/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/extract-xiso/build --parallel "$(nproc)"
          EXTRACT_XISO_BIN="$(find /tmp/extract-xiso/build -type f -name 'extract-xiso' -perm -111 -print -quit)"
          [[ -n "${EXTRACT_XISO_BIN}" ]] || { echo "ERROR: extract-xiso executable was not produced."; exit 1; }
          install -Dm755 "${EXTRACT_XISO_BIN}" /usr/local/bin/extract-xiso
          extract-xiso -h || true

      - name: Validate Download Configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${BASE_URL:-}" ]] || { echo "ERROR: SONIC_BASE_URL secret is not configured."; exit 1; }
          [[ -n "${ARCHIVE_PREFIX:-}" ]] || { echo "ERROR: SONIC_ARCHIVE_PREFIX secret is not configured."; exit 1; }
          [[ -n "${ARCHIVE_PASSWORD:-}" ]] || { echo "ERROR: SONIC_ARCHIVE_PASSWORD secret is not configured."; exit 1; }

      - name: Download Sonic Xbox 360 Release
        shell: bash
        env:
          RAR_PARTS: ${{ inputs.rar_parts }}
        run: |
          set -euo pipefail
          if ! [[ "${RAR_PARTS:-}" =~ ^[0-9]+$ ]] || [ "${RAR_PARTS}" -lt 1 ]; then
            RAR_PARTS=8
          fi
          RAW="${DATA_ROOT}/sonic_raw"
          mkdir -p "${RAW}"
          for i in $(seq 1 "${RAR_PARTS}"); do
            FILE="${ARCHIVE_PREFIX}.part${i}.rar"
            URL="${BASE_URL%/}/${FILE}"
            OUTPUT="${RAW}/${FILE}"
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 1800 --continue-at - \
              --output "${OUTPUT}" "${URL}"
            [[ -s "${OUTPUT}" ]] || { echo "ERROR: Downloaded file is empty: ${OUTPUT}"; exit 1; }
            ls -lh "${OUTPUT}"
          done

      - name: Validate RAR Parts
        shell: bash
        env:
          RAR_PARTS: ${{ inputs.rar_parts }}
        run: |
          set -euo pipefail
          if ! [[ "${RAR_PARTS:-}" =~ ^[0-9]+$ ]] || [ "${RAR_PARTS}" -lt 1 ]; then
            RAR_PARTS=8
          fi
          for i in $(seq 1 "${RAR_PARTS}"); do
            FILE="${DATA_ROOT}/sonic_raw/${ARCHIVE_PREFIX}.part${i}.rar"
            [[ -s "${FILE}" ]] || { echo "ERROR: Empty file: ${FILE}"; exit 1; }
            MAGIC="$(dd if="${FILE}" bs=1 count=7 2>/dev/null | od -An -tx1 | tr -d ' \n')"
            case "${MAGIC}" in
              526172211a0700|526172211a0701) ;;
              *) echo "ERROR: Invalid RAR signature: ${FILE}"; file "${FILE}"; exit 1 ;;
            esac
          done

      - name: Extract Sonic Release
        shell: bash
        run: |
          set -euo pipefail
          DEST="${DATA_ROOT}/extracted_assets"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          FIRST_PART="${DATA_ROOT}/sonic_raw/${ARCHIVE_PREFIX}.part1.rar"
          if ! 7z x "${FIRST_PART}" "-o${DEST}" "-p${ARCHIVE_PASSWORD}" -y; then
            echo "7z failed; retrying with unrar..." >&2
            unrar x -p"${ARCHIVE_PASSWORD}" -o+ "${FIRST_PART}" "${DEST}/"
          fi
          # Free ~7 GiB immediately: the RAR parts are no longer needed.
          rm -rf "${DATA_ROOT}/sonic_raw"
          find "${DEST}" -maxdepth 4 -type f -print | sed -n '1,100p'
          df -h "${DATA_ROOT}" || true

      - name: Locate Xbox 360 ISO
        shell: bash
        run: |
          set -euo pipefail
          ISO_FILE="$(find "${DATA_ROOT}/extracted_assets" -type f \( -iname '*.iso' -o -iname '*.xiso' \) -print -quit)"
          [[ -n "${ISO_FILE}" && -s "${ISO_FILE}" ]] || { echo "ERROR: No usable ISO/XISO image was found."; exit 1; }
          ls -lh "${ISO_FILE}"
          file "${ISO_FILE}"
          printf 'ISO_FILE=%s\n' "${ISO_FILE}" >> "${GITHUB_ENV}"

      - name: Inspect Xbox 360 XISO
        shell: bash
        run: |
          set -euo pipefail
          extract-xiso -l "${ISO_FILE}" > "${DATA_ROOT}/xiso_contents.txt" || true
          sed -n '1,100p' "${DATA_ROOT}/xiso_contents.txt"
          grep -Eiq 'default\.xex' "${DATA_ROOT}/xiso_contents.txt" || echo "WARNING: default.xex was not found in the XISO listing."
          grep -Eiq 'shader\.arc' "${DATA_ROOT}/xiso_contents.txt" || echo "WARNING: shader.arc was not found in the XISO listing."

      - name: Extract Xbox 360 Filesystem
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR_PATH="${DATA_ROOT}/xbox360_game"
          rm -rf "${GAME_DIR_PATH}"
          mkdir -p "${GAME_DIR_PATH}"
          extract-xiso "${ISO_FILE}" -d "${GAME_DIR_PATH}"
          # Free the ~7 GiB ISO: the extracted filesystem is what we ship.
          rm -rf "${DATA_ROOT}/extracted_assets"
          printf 'GAME_DIR=%s\n' "${GAME_DIR_PATH}" >> "${GITHUB_ENV}"
          du -sh "${GAME_DIR_PATH}"
          find "${GAME_DIR_PATH}" -maxdepth 2 -type f | sed -n '1,60p'
          df -h "${DATA_ROOT}" || true

      - name: Locate Game Files
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_XEX="$(find "${GAME_DIR}" -type f -iname 'default.xex' -print -quit)"
          SHADER_ARC="$(find "${GAME_DIR}" -type f -iname 'shader.arc' -print -quit)"
          SHADER_LT_ARC="$(find "${GAME_DIR}" -type f -iname 'shader_lt.arc' -print -quit)"
          echo "default.xex   = ${DEFAULT_XEX:-NOT FOUND}"
          echo "shader.arc    = ${SHADER_ARC:-NOT FOUND}"
          echo "shader_lt.arc = ${SHADER_LT_ARC:-NOT FOUND}"
          [[ -n "${DEFAULT_XEX}" ]] || exit 1
          [[ -n "${SHADER_ARC}" ]] || exit 1
          [[ -n "${SHADER_LT_ARC}" ]] || exit 1
          {
            echo "DEFAULT_XEX=${DEFAULT_XEX}"
            echo "SHADER_ARC=${SHADER_ARC}"
            echo "SHADER_LT_ARC=${SHADER_LT_ARC}"
          } >> "${GITHUB_ENV}"

      - name: Prepare MarathonRecomp Game Data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p MarathonRecompLib/private
          install -m 0644 "${DEFAULT_XEX}" MarathonRecompLib/private/default.xex
          install -m 0644 "${SHADER_ARC}" MarathonRecompLib/private/shader.arc
          install -m 0644 "${SHADER_LT_ARC}" MarathonRecompLib/private/shader_lt.arc

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          set -euo pipefail
          export VCPKG_ROOT="${GITHUB_WORKSPACE}/thirdparty/vcpkg"
          export VCPKG_DISABLE_METRICS=1
          [[ -d "${VCPKG_ROOT}" ]] || exit 1
          [[ -f "${VCPKG_ROOT}/bootstrap-vcpkg.sh" ]] || exit 1
          cd "${VCPKG_ROOT}"
          chmod +x bootstrap-vcpkg.sh
          ./bootstrap-vcpkg.sh -disableMetrics
          [[ -x "${VCPKG_ROOT}/vcpkg" ]] || exit 1
          "${VCPKG_ROOT}/vcpkg" version

      - name: Configure CMake
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/thirdparty/vcpkg
        run: |
          set -euo pipefail
          PRESET="${{ inputs.build_type }}"
          test -x "${VCPKG_ROOT}/vcpkg"
          cmake --preset "${PRESET}" \
            -DCMAKE_AR=/usr/bin/llvm-ar \
            -DCMAKE_RANLIB=/usr/bin/llvm-ranlib \
            -DCMAKE_C_COMPILER_AR=/usr/bin/llvm-ar \
            -DCMAKE_C_COMPILER_RANLIB=/usr/bin/llvm-ranlib \
            -DCMAKE_CXX_COMPILER_AR=/usr/bin/llvm-ar \
            -DCMAKE_CXX_COMPILER_RANLIB=/usr/bin/llvm-ranlib

      - name: Build MarathonRecomp
        shell: bash
        run: |
          set -euo pipefail
          PRESET="${{ inputs.build_type }}"
          BUILD_DIR="./out/build/${PRESET}"
          [[ -d "${BUILD_DIR}" ]] || exit 1
          cmake --build "${BUILD_DIR}" --target MarathonRecomp --parallel "$(nproc)"

      - name: Verify Linux Binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="./out/build/${{ inputs.build_type }}/MarathonRecomp/MarathonRecomp"
          [[ -f "${BIN}" ]] || { echo "ERROR: MarathonRecomp binary was not produced."; exit 1; }
          chmod +x "${BIN}"
          file "${BIN}"
          readelf -h "${BIN}" | sed -n '1,20p'
          if ldd "${BIN}" 2>/dev/null | grep -qi 'not found'; then
            echo "ERROR: unresolved shared libraries:"
            ldd "${BIN}" || true
            exit 1
          fi
          ldd "${BIN}" || true

      - name: Stage Binary and Free Scratch Space
        shell: bash
        run: |
          set -euo pipefail
          PRESET="${{ inputs.build_type }}"
          BIN="./out/build/${PRESET}/MarathonRecomp/MarathonRecomp"
          [[ -f "${BIN}" ]] || { echo "ERROR: staged binary missing."; exit 1; }
          STAGE="${DATA_ROOT}/stage"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}"
          mv "${BIN}" "${STAGE}/MarathonRecomp"
          chmod 0755 "${STAGE}/MarathonRecomp"
          file "${STAGE}/MarathonRecomp"
          # Free several GiB before packaging the ~7 GiB game payload.
          rm -rf "${GITHUB_WORKSPACE}/out/build" || true
          rm -rf "${GITHUB_WORKSPACE}/thirdparty/vcpkg/buildtrees" \
                 "${GITHUB_WORKSPACE}/thirdparty/vcpkg/packages" || true
          rm -rf "${GITHUB_WORKSPACE}/MarathonRecompLib/private" || true
          df -h "${DATA_ROOT}" || true

      - name: Build Single-File Full-Game Installer
        shell: bash
        env:
          ZSTD_LEVEL: ${{ inputs.zstd_level }}
        run: |
          set -euo pipefail

          if ! [[ "${ZSTD_LEVEL:-}" =~ ^[0-9]+$ ]] || [ "${ZSTD_LEVEL}" -lt 1 ] || [ "${ZSTD_LEVEL}" -gt 19 ]; then
            ZSTD_LEVEL=10
          fi
          echo "Using zstd level ${ZSTD_LEVEL}"

          STAGE="${DATA_ROOT}/stage"
          WORK="${DATA_ROOT}/installer_work"
          INSTALLER="${DATA_ROOT}/${INSTALLER_NAME}"

          rm -rf "${WORK}" "${INSTALLER}" "${DATA_ROOT}/SHA256SUMS.txt" "${DATA_ROOT}/installer_listing.txt"
          mkdir -p "${WORK}"

          install -m 0755 "${STAGE}/MarathonRecomp" "${WORK}/MarathonRecomp"
          install -m 0755 /usr/local/bin/extract-xiso "${WORK}/extract-xiso"

          cat > "${WORK}/run-sonic.sh" <<'LAUNCHER'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          cd "${DIR}"
          exec ./MarathonRecomp "$@"
          LAUNCHER
          chmod 0755 "${WORK}/run-sonic.sh"

          touch "${WORK}/portable.txt"

          cat > "${WORK}/README.txt" <<'README'
          Sonic the Hedgehog (2006) - MarathonRecomp (CachyOS/Linux)
          ==========================================================

          COMPLETE, self-contained installation containing:
            MarathonRecomp   Linux executable
            run-sonic.sh     Launcher
            portable.txt     Portable (relative) data paths
            extract-xiso     XISO tool (kept for repairs)
            game/            Complete Xbox 360 game filesystem

          RUNNING
            <install-dir>/run-sonic.sh
            or: cd <install-dir> && ./MarathonRecomp

          RUNTIME DEPENDENCIES (CachyOS/Arch)
            sudo pacman -S --needed gtk3 alsa-lib libpulse pipewire mesa vulkan-icd-loader

          GRAPHICS BACKEND (GNOME/Wayland problems)
            <install-dir>/run-sonic.sh --sdl-video-driver wayland
            <install-dir>/run-sonic.sh --sdl-video-driver x11
          README

          cat > "${WORK}/install.sh" <<'POST'
          #!/usr/bin/env bash
          set -euo pipefail

          PREFIX="${1:?missing prefix}"

          if [ ! -f "${PREFIX}/game/default.xex" ]; then
            echo "ERROR: ${PREFIX}/game/default.xex is missing; extraction failed." >&2
            exit 1
          fi

          chmod 0755 "${PREFIX}/MarathonRecomp" \
                     "${PREFIX}/run-sonic.sh" \
                     "${PREFIX}/extract-xiso"
          [ -f "${PREFIX}/portable.txt" ] || : > "${PREFIX}/portable.txt"

          BIN_DIR="${HOME}/.local/bin"
          DESKTOP_DIR="${HOME}/.local/share/applications"
          mkdir -p "${BIN_DIR}" "${DESKTOP_DIR}"

          ln -sfn "${PREFIX}/run-sonic.sh" "${BIN_DIR}/sonic2006"

          cat > "${DESKTOP_DIR}/Sonic-2006-MarathonRecomp.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Sonic the Hedgehog (2006)
          Comment=MarathonRecomp - recompiled for Linux
          Exec=${PREFIX}/run-sonic.sh
          Path=${PREFIX}
          Terminal=false
          Categories=Game;
          DESKTOP

          command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database "${DESKTOP_DIR}" || true

          echo "Post-install setup OK."
          POST
          chmod 0755 "${WORK}/install.sh"

          # Move (do not copy) the extracted game into the payload to save several GiB.
          mv "${GAME_DIR}" "${WORK}/game"
          [ -f "${WORK}/game/default.xex" ] || { echo "ERROR: game/default.xex missing."; exit 1; }
          du -sh "${WORK}/game"

          cat > "${WORK}/stub" <<'STUB'
          #!/usr/bin/env bash
          set -euo pipefail

          # Sonic the Hedgehog (2006) - MarathonRecomp
          # Single-file self-extracting installer (shell stub + zstd/tar payload).

          DEFAULT_PREFIX="${HOME}/.local/share/MarathonRecomp"
          PREFIX="${SONIC_INSTALL_DIR:-${1:-${DEFAULT_PREFIX}}}"
          PAYLOAD_LINE=__PAYLOAD_LINE__

          SELF="$(readlink -f -- "$0")"
          [ -r "${SELF}" ] || { echo "ERROR: cannot read ${SELF}" >&2; exit 1; }

          command -v zstd >/dev/null 2>&1 || {
            echo "ERROR: 'zstd' is required (preinstalled on Arch/CachyOS)." >&2
            exit 1
          }

          if [ -e "${PREFIX}/game/default.xex" ]; then
            if [ "${SONIC_YES:-}" = "1" ]; then
              :
            elif [ -t 0 ]; then
              read -r -p "Existing installation found at ${PREFIX}. Overwrite? [y/N] " ans
              case "${ans}" in
                y|Y|yes|YES) ;;
                *) echo "Aborted."; exit 1 ;;
              esac
            else
              echo "ERROR: an installation already exists at ${PREFIX}." >&2
              echo "Re-run in a terminal, or set SONIC_YES=1 to overwrite." >&2
              exit 1
            fi
            rm -rf "${PREFIX}/game"
          fi

          mkdir -p "${PREFIX}"
          echo "Installing to: ${PREFIX}"
          echo "Extracting the complete game (this may take several minutes)..."

          tail -n +"${PAYLOAD_LINE}" "${SELF}" | zstd -dc | tar -x -C "${PREFIX}"

          bash "${PREFIX}/install.sh" "${PREFIX}"

          echo
          echo "=== Installation complete ==="
          echo "Game files    : ${PREFIX}/game"
          echo "Launcher      : ${PREFIX}/run-sonic.sh"
          echo "Desktop entry : ${HOME}/.local/share/applications/Sonic-2006-MarathonRecomp.desktop"
          echo

          if [ -t 0 ]; then
            read -r -p "Start the game now? [y/N] " ans
            case "${ans}" in
              y|Y|yes|YES)
                cd "${PREFIX}"
                exec ./run-sonic.sh
                ;;
            esac
          fi

          echo "Start later with: ${PREFIX}/run-sonic.sh"
          exit 0
          __PAYLOAD_MARKER__
          STUB

          MARKER_LINE="$(grep -n '^__PAYLOAD_MARKER__$' "${WORK}/stub" | cut -d: -f1)"
          [ -n "${MARKER_LINE}" ] || { echo "ERROR: payload marker missing from stub."; exit 1; }
          PAYLOAD_START="$((MARKER_LINE + 1))"
          echo "Payload starts at line ${PAYLOAD_START}"

          sed "s/__PAYLOAD_LINE__/${PAYLOAD_START}/" "${WORK}/stub" > "${INSTALLER}"
          tar -cf - -C "${WORK}" \
            install.sh README.txt portable.txt run-sonic.sh extract-xiso MarathonRecomp game \
            | zstd -T0 -"${ZSTD_LEVEL}" >> "${INSTALLER}"
          chmod 0755 "${INSTALLER}"

          echo "Verifying the embedded payload stream..."
          tail -n +"${PAYLOAD_START}" "${INSTALLER}" | zstd -dc | tar -tf - > "${DATA_ROOT}/installer_listing.txt"
          grep -qx 'game/default.xex' "${DATA_ROOT}/installer_listing.txt" \
            || { echo "ERROR: payload integrity check failed."; exit 1; }
          echo "Payload contains $(wc -l < "${DATA_ROOT}/installer_listing.txt") entries:"
          sed -n '1,25p' "${DATA_ROOT}/installer_listing.txt"

          ( cd "${DATA_ROOT}" && sha256sum "${INSTALLER_NAME}" > SHA256SUMS.txt )

          rm -rf "${WORK}"

          echo "Single-file full-game installer created:"
          ls -lh "${INSTALLER}"
          file "${INSTALLER}"
          df -h "${DATA_ROOT}" || true

      - name: Upload Single-File Installer (Artifact)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-2006-CachyOS-FULL-${{ inputs.build_type }}-${{ github.run_number }}
          path: |
            ${{ steps.dataroot.outputs.path }}/${{ env.INSTALLER_NAME }}
            ${{ steps.dataroot.outputs.path }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Prepare Release Assets
        shell: bash
        run: |
          set -euo pipefail
          cd "${DATA_ROOT}"
          ASSETS="${DATA_ROOT}/release_assets"
          rm -rf "${ASSETS}"
          mkdir -p "${ASSETS}"

          SIZE="$(stat -c%s "${INSTALLER_NAME}")"
          SIZE_H="$(numfmt --to=iec "${SIZE}")"
          LIMIT="1992294400"   # 1900 MiB; GitHub release assets must stay below 2 GiB
          SPLIT="0"

          if [ "${SIZE}" -le "${LIMIT}" ]; then
            echo "Installer fits in a single release asset (${SIZE_H})."
            cp "${INSTALLER_NAME}" "${ASSETS}/"
            cp SHA256SUMS.txt "${ASSETS}/"
          else
            SPLIT="1"
            echo "Installer is ${SIZE_H}; splitting into 1900 MiB parts."
            split -b 1900M -d -a 2 "${INSTALLER_NAME}" "${ASSETS}/${INSTALLER_NAME}.part"
            cp SHA256SUMS.txt "${ASSETS}/"
            ( cd "${ASSETS}" && sha256sum "${INSTALLER_NAME}".part* > SHA256SUMS.parts )

            cat > "${ASSETS}/join-and-install.sh" <<'JOIN'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname -- "${BASH_SOURCE[0]}")"
          BASE="Sonic-the-Hedgehog-2006-CachyOS-FULL-installer.run"
          if [ -f SHA256SUMS.parts ]; then
            echo "Verifying part checksums..."
            sha256sum -c SHA256SUMS.parts
          fi
          echo "Joining parts..."
          cat "${BASE}".part* > "${BASE}"
          chmod 0755 "${BASE}"
          echo "Created: ${BASE}"
          exec "./${BASE}" "$@"
          JOIN
            chmod 0755 "${ASSETS}/join-and-install.sh"

            cat > "${ASSETS}/README-parts.txt" <<'NOTE'
          These files are 1900 MiB parts of the single-file installer:

            Sonic-the-Hedgehog-2006-CachyOS-FULL-installer.run

          Download ALL *.part* files plus join-and-install.sh and
          SHA256SUMS.parts into the SAME folder, then run:

            chmod +x join-and-install.sh
            ./join-and-install.sh

          Manual alternative:

            cat Sonic-the-Hedgehog-2006-CachyOS-FULL-installer.run.part* \
              > Sonic-the-Hedgehog-2006-CachyOS-FULL-installer.run
            chmod +x Sonic-the-Hedgehog-2006-CachyOS-FULL-installer.run
            ./Sonic-the-Hedgehog-2006-CachyOS-FULL-installer.run
          NOTE

            rm -f "${INSTALLER_NAME}"
          fi

          cat > "${DATA_ROOT}/release_body.md" <<BODY
          # Sonic the Hedgehog (2006) - MarathonRecomp (CachyOS/Linux)

          ## FULL single-file release - the complete game is included

          One self-extracting file containing the MarathonRecomp Linux executable
          and the complete extracted Xbox 360 game filesystem:

              ${INSTALLER_NAME}

          Size: ${SIZE_H}

          ### Install

              chmod +x ${INSTALLER_NAME}
              ./${INSTALLER_NAME}

          Default install location: ~/.local/share/MarathonRecomp

          Custom location:

              ./${INSTALLER_NAME} ~/Games/Sonic2006

          Non-interactive overwrite:

              SONIC_YES=1 ./${INSTALLER_NAME}

          ### Requirements (CachyOS/Arch)

              sudo pacman -S --needed gtk3 alsa-lib libpulse pipewire mesa vulkan-icd-loader

          ### Wayland note

              ~/.local/share/MarathonRecomp/run-sonic.sh --sdl-video-driver wayland
              ~/.local/share/MarathonRecomp/run-sonic.sh --sdl-video-driver x11
          BODY

          if [ "${SPLIT}" = "1" ]; then
            cat >> "${DATA_ROOT}/release_body.md" <<BODY

          ### Split parts

          GitHub limits each release file to 2 GiB, so this installer is split
          into 1900 MiB parts. Download ALL *.part* files plus join-and-install.sh
          and SHA256SUMS.parts into one folder and run:

              chmod +x join-and-install.sh
              ./join-and-install.sh

          Manual join:

              cat ${INSTALLER_NAME}.part* > ${INSTALLER_NAME}
              chmod +x ${INSTALLER_NAME}
              ./${INSTALLER_NAME}
          BODY
          fi

          ls -lh "${ASSETS}"

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "sonic-cachyos-full-${{ inputs.build_type }}-${{ github.run_number }}"
          name: "Sonic CachyOS FULL ${{ inputs.build_type }} #${{ github.run_number }}"
          files: ${{ steps.dataroot.outputs.path }}/release_assets/*
          body_path: ${{ steps.dataroot.outputs.path }}/release_body.md
