name: Build and Release Sonic CachyOS

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: CMake build configuration
        required: true
        default: linux-release
        type: choice
        options:
          - linux-release
          - linux-relwithdebinfo
          - linux-debug

permissions:
  contents: write

env:
  BASE_URL: ${{ secrets.SONIC_BASE_URL }}
  ARCHIVE_PREFIX: ${{ secrets.SONIC_ARCHIVE_PREFIX }}
  ARCHIVE_PASSWORD: ${{ secrets.SONIC_ARCHIVE_PASSWORD }}

jobs:
  build:
    name: Build & Release Sonic
    runs-on: ubuntu-24.04

    container:
      image: archlinux:latest

    steps:
      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel git cmake ninja clang llvm lld \
            gtk3 alsa-lib libpulse pipewire pkgconf p7zip \
            curl zip unzip tar file binutils ca-certificates zlib
          update-ca-trust
          command -v git
          command -v cmake
          command -v ninja
          command -v clang
          command -v llvm-ar
          command -v llvm-ranlib
          command -v curl
          command -v zip
          command -v unzip
          command -v tar
          command -v 7z
          llvm-ar --version
          llvm-ranlib --version

      - name: Checkout MarathonRecomp
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build extract-xiso
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/extract-xiso
          git clone --depth 1 https://github.com/XboxDev/extract-xiso.git /tmp/extract-xiso
          cmake -S /tmp/extract-xiso -B /tmp/extract-xiso/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/extract-xiso/build --parallel "$(nproc)"
          EXTRACT_XISO_BIN="$(find /tmp/extract-xiso/build -type f -name 'extract-xiso' -perm -111 -print -quit)"
          [[ -n "${EXTRACT_XISO_BIN}" ]] || { echo "ERROR: extract-xiso executable was not produced."; exit 1; }
          install -Dm755 "${EXTRACT_XISO_BIN}" /usr/local/bin/extract-xiso
          extract-xiso -h

      - name: Validate Download Configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${BASE_URL:-}" ]] || { echo "ERROR: SONIC_BASE_URL secret is not configured."; exit 1; }
          [[ -n "${ARCHIVE_PREFIX:-}" ]] || { echo "ERROR: SONIC_ARCHIVE_PREFIX secret is not configured."; exit 1; }
          [[ -n "${ARCHIVE_PASSWORD:-}" ]] || { echo "ERROR: SONIC_ARCHIVE_PASSWORD secret is not configured."; exit 1; }

      - name: Download Sonic Xbox 360 Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sonic_raw
          for i in $(seq 1 8); do
            FILE="${ARCHIVE_PREFIX}.part${i}.rar"
            URL="${BASE_URL%/}/${FILE}"
            OUTPUT="sonic_raw/${FILE}"
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 1800 --continue-at - \
              --output "${OUTPUT}" "${URL}"
            [[ -s "${OUTPUT}" ]] || { echo "ERROR: Downloaded file is empty: ${OUTPUT}"; exit 1; }
            ls -lh "${OUTPUT}"
          done

      - name: Validate RAR Parts
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 8); do
            FILE="sonic_raw/${ARCHIVE_PREFIX}.part${i}.rar"
            [[ -s "${FILE}" ]] || { echo "ERROR: Empty file: ${FILE}"; exit 1; }
            MAGIC="$(dd if="${FILE}" bs=1 count=7 2>/dev/null | od -An -tx1 | tr -d ' \n')"
            case "${MAGIC}" in
              526172211a0700|526172211a070100) ;;
              *) echo "ERROR: Invalid RAR signature: ${FILE}"; file "${FILE}"; exit 1 ;;
            esac
          done

      - name: Extract Sonic Release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted_assets
          mkdir -p extracted_assets
          FIRST_PART="sonic_raw/${ARCHIVE_PREFIX}.part1.rar"
          7z x "${FIRST_PART}" "-oextracted_assets" "-p${ARCHIVE_PASSWORD}" -y
          find extracted_assets -maxdepth 4 -type f -print > extracted_listing.txt
          sed -n '1,200p' extracted_listing.txt

      - name: Locate Xbox 360 ISO
        shell: bash
        run: |
          set -euo pipefail
          ISO_FILE="$(find extracted_assets -type f \( -iname '*.iso' -o -iname '*.xiso' \) -print -quit)"
          [[ -n "${ISO_FILE}" && -s "${ISO_FILE}" ]] || { echo "ERROR: No usable ISO/XISO image was found."; exit 1; }
          ls -lh "${ISO_FILE}"
          file "${ISO_FILE}"
          printf 'ISO_FILE=%s\n' "${ISO_FILE}" >> "${GITHUB_ENV}"

      - name: Inspect Xbox 360 XISO
        shell: bash
        run: |
          set -euo pipefail
          extract-xiso -l "${ISO_FILE}" > xiso_contents.txt
          sed -n '1,250p' xiso_contents.txt
          grep -Eiq 'default\.xex' xiso_contents.txt || echo "WARNING: default.xex was not found in the XISO listing."
          grep -Eiq 'shader\.arc' xiso_contents.txt || echo "WARNING: shader.arc was not found in the XISO listing."
          grep -Eiq 'shader_lt\.arc' xiso_contents.txt || echo "WARNING: shader_lt.arc was not found in the XISO listing."

      - name: Extract Xbox 360 Filesystem
        shell: bash
        run: |
          set -euo pipefail
          rm -rf xbox360_game
          mkdir -p xbox360_game
          extract-xiso "${ISO_FILE}" -d xbox360_game
          du -sh xbox360_game
          find xbox360_game -type f -print > xbox360_listing.txt
          sed -n '1,250p' xbox360_listing.txt

      - name: Locate Game Files
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_XEX="$(find xbox360_game -type f -iname 'default.xex' -print -quit)"
          SHADER_ARC="$(find xbox360_game -type f -iname 'shader.arc' -print -quit)"
          SHADER_LT_ARC="$(find xbox360_game -type f -iname 'shader_lt.arc' -print -quit)"
          echo "default.xex   = ${DEFAULT_XEX:-NOT FOUND}"
          echo "shader.arc    = ${SHADER_ARC:-NOT FOUND}"
          echo "shader_lt.arc = ${SHADER_LT_ARC:-NOT FOUND}"
          [[ -n "${DEFAULT_XEX}" ]] || exit 1
          [[ -n "${SHADER_ARC}" ]] || exit 1
          [[ -n "${SHADER_LT_ARC}" ]] || exit 1
          {
            echo "DEFAULT_XEX=${DEFAULT_XEX}"
            echo "SHADER_ARC=${SHADER_ARC}"
            echo "SHADER_LT_ARC=${SHADER_LT_ARC}"
          } >> "${GITHUB_ENV}"

      - name: Prepare MarathonRecomp Game Data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p MarathonRecompLib/private
          install -m 0644 "${DEFAULT_XEX}" MarathonRecompLib/private/default.xex
          install -m 0644 "${SHADER_ARC}" MarathonRecompLib/private/shader.arc
          install -m 0644 "${SHADER_LT_ARC}" MarathonRecompLib/private/shader_lt.arc

      - name: Cleanup Downloaded Archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sonic_raw
          rm -f "${ISO_FILE}"

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          set -euo pipefail
          export VCPKG_ROOT="${GITHUB_WORKSPACE}/thirdparty/vcpkg"
          export VCPKG_DISABLE_METRICS=1
          [[ -d "${VCPKG_ROOT}" ]] || exit 1
          [[ -f "${VCPKG_ROOT}/bootstrap-vcpkg.sh" ]] || exit 1
          command -v cmake
          command -v ninja
          command -v git
          command -v curl
          command -v zip
          command -v unzip
          command -v tar
          cd "${VCPKG_ROOT}"
          chmod +x bootstrap-vcpkg.sh
          ./bootstrap-vcpkg.sh -disableMetrics
          [[ -x "${VCPKG_ROOT}/vcpkg" ]] || exit 1
          "${VCPKG_ROOT}/vcpkg" version

      - name: Configure CMake
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/thirdparty/vcpkg
        run: |
          set -euo pipefail
          PRESET="${{ inputs.build_type }}"
          command -v cmake
          command -v ninja
          command -v clang
          command -v llvm-ar
          command -v llvm-ranlib
          test -x "${VCPKG_ROOT}/vcpkg"
          cmake --preset "${PRESET}" \
            -DCMAKE_AR=/usr/bin/llvm-ar \
            -DCMAKE_RANLIB=/usr/bin/llvm-ranlib \
            -DCMAKE_C_COMPILER_AR=/usr/bin/llvm-ar \
            -DCMAKE_C_COMPILER_RANLIB=/usr/bin/llvm-ranlib \
            -DCMAKE_CXX_COMPILER_AR=/usr/bin/llvm-ar \
            -DCMAKE_CXX_COMPILER_RANLIB=/usr/bin/llvm-ranlib

      - name: Build MarathonRecomp
        shell: bash
        run: |
          set -euo pipefail
          PRESET="${{ inputs.build_type }}"
          BUILD_DIR="./out/build/${PRESET}"
          [[ -d "${BUILD_DIR}" ]] || exit 1
          cmake --build "${BUILD_DIR}" --target MarathonRecomp --parallel "$(nproc)"

      - name: Verify Linux Binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="./out/build/${{ inputs.build_type }}/MarathonRecomp/MarathonRecomp"
          [[ -f "${BIN}" ]] || { echo "ERROR: MarathonRecomp binary was not produced."; exit 1; }
          chmod +x "${BIN}"
          file "${BIN}"
          readelf -h "${BIN}" | sed -n '1,25p'
          ldd "${BIN}" || true

      - name: Build Single-File Installer
        shell: bash
        run: |
          set -euo pipefail

          STAGE="installer_stage"
          WORK="installer_work"
          INSTALLER="Sonic-the-Hedgehog-2006-CachyOS-installer.run"
          BIN="./out/build/${{ inputs.build_type }}/MarathonRecomp/MarathonRecomp"

          rm -rf "${STAGE}" "${WORK}" "${INSTALLER}"
          mkdir -p "${STAGE}/payload" "${WORK}"

          install -m 0755 "${BIN}" "${STAGE}/payload/MarathonRecomp"
          install -m 0755 /usr/local/bin/extract-xiso "${STAGE}/payload/extract-xiso"

          cat > "${STAGE}/payload/install.sh" <<'INSTALL_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          PREFIX="${HOME}/.local/share/MarathonRecomp"
          BIN_DIR="${HOME}/.local/bin"
          DESKTOP_DIR="${HOME}/.local/share/applications"

          echo "Sonic the Hedgehog (2006) - MarathonRecomp"
          echo
          echo "Installation directory: ${PREFIX}"
          echo

          ISO="${1:-}"
          if [[ -z "${ISO}" ]]; then
            read -r -p "Path to your legally obtained Xbox 360 ISO/XISO: " ISO
          fi

          [[ -n "${ISO}" ]] || { echo "ERROR: No ISO path supplied."; exit 1; }
          [[ -f "${ISO}" ]] || { echo "ERROR: ISO file not found: ${ISO}"; exit 1; }

          rm -rf "${PREFIX}"
          mkdir -p "${PREFIX}/game" "${BIN_DIR}" "${DESKTOP_DIR}"

          install -m 0755 "${SCRIPT_DIR}/MarathonRecomp" "${PREFIX}/MarathonRecomp"
          install -m 0755 "${SCRIPT_DIR}/extract-xiso" "${PREFIX}/extract-xiso"

          echo
          echo "Extracting the game filesystem from your ISO..."
          "${PREFIX}/extract-xiso" "${ISO}" -d "${PREFIX}/game"

          [[ -f "${PREFIX}/game/default.xex" ]] || {
            echo "ERROR: default.xex was not found after ISO extraction."
            rm -rf "${PREFIX}"
            exit 1
          }

          cat > "${PREFIX}/run-sonic.sh" <<'LAUNCHER'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          cd "${SCRIPT_DIR}"
          exec "./MarathonRecomp" "$@"
          LAUNCHER
          chmod +x "${PREFIX}/run-sonic.sh"

          ln -sfn "${PREFIX}/MarathonRecomp" "${BIN_DIR}/MarathonRecomp"

          cat > "${DESKTOP_DIR}/MarathonRecomp.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Sonic the Hedgehog (2006) - MarathonRecomp
          Comment=Sonic the Hedgehog (2006) recompiled for Linux
          Exec=${PREFIX}/MarathonRecomp
          Path=${PREFIX}
          Terminal=false
          Categories=Game;
          DESKTOP

          echo
          echo "Installation complete."
          echo "Game files: ${PREFIX}/game"
          echo "Launcher: ${PREFIX}/run-sonic.sh"
          echo "Desktop entry: ${DESKTOP_DIR}/MarathonRecomp.desktop"
          echo
          echo "Starting the game..."
          exec "${PREFIX}/MarathonRecomp"
          INSTALL_SCRIPT

          chmod +x "${STAGE}/payload/install.sh"

          cat > "${STAGE}/README.txt" <<'README'
          Sonic the Hedgehog (2006) - MarathonRecomp for CachyOS/Linux

          This is a single-file installer.

          Usage:
            ./Sonic-the-Hedgehog-2006-CachyOS-installer.run

          The installer contains the Linux executable and XISO extractor.
          It does NOT contain original Sonic the Hedgehog game assets.

          During installation, provide the path to your own legally obtained
          Xbox 360 ISO/XISO image. The installer extracts the complete game
          filesystem into:

            ~/.local/share/MarathonRecomp/game

          The launcher is installed at:

            ~/.local/share/MarathonRecomp/run-sonic.sh
          README

          cp "${STAGE}/README.txt" "${WORK}/README.txt"
          cp "${STAGE}/payload"/* "${WORK}/"

          cat > "${WORK}/stub" <<'STUB'
          #!/usr/bin/env bash
          set -euo pipefail

          PAYLOAD_LINE=__PAYLOAD_LINE__
          SELF="$(readlink -f "$0")"
          TMP="$(mktemp -d)"
          cleanup() { rm -rf "${TMP}"; }
          trap cleanup EXIT

          tail -n +"${PAYLOAD_LINE}" "${SELF}" | tar -xzf - -C "${TMP}"
          exec "${TMP}/install.sh" "$@"
          STUB

          PAYLOAD_LINE="$(grep -n '^__PAYLOAD__$' "${WORK}/stub" | cut -d: -f1)"
          (( PAYLOAD_LINE > 0 )) || { echo "ERROR: payload marker missing"; exit 1; }
          PAYLOAD_LINE=$((PAYLOAD_LINE + 1))

          sed "s/^PAYLOAD_LINE=.*/PAYLOAD_LINE=${PAYLOAD_LINE}/" "${WORK}/stub" > "${INSTALLER}"
          printf '\n__PAYLOAD__\n' >> "${INSTALLER}"
          tar -czf - -C "${WORK}" install.sh MarathonRecomp extract-xiso README.txt >> "${INSTALLER}"
          chmod +x "${INSTALLER}"

          echo "Single-file installer created:"
          ls -lh "${INSTALLER}"
          file "${INSTALLER}"

      - name: Upload Single-File Installer
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-the-Hedgehog-2006-CachyOS-${{ inputs.build_type }}-${{ github.run_number }}
          path: Sonic-the-Hedgehog-2006-CachyOS-installer.run
          if-no-files-found: error
          retention-days: 30

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "sonic-cachyos-${{ inputs.build_type }}-${{ github.run_number }}"
          name: "Sonic CachyOS ${{ inputs.build_type }} #${{ github.run_number }}"
          files: Sonic-the-Hedgehog-2006-CachyOS-installer.run
          body: |
            # Sonic the Hedgehog (2006)
            ## Marathon Recompiled — CachyOS/Linux

            This release contains a single-file Linux installer.

            The installer includes the MarathonRecomp executable and XISO extractor.
            Original Sonic the Hedgehog game assets are not included.

            During installation, provide your own legally obtained Xbox 360 ISO/XISO.
            The installer extracts the game filesystem to:

              ~/.local/share/MarathonRecomp/game
